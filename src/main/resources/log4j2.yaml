
Configuration:
  name: dina

  Appenders:
    Console:
      name: LogToConsole
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d [%t] %-5p %c - %m%n"

  Loggers:
      Logger:
        - name: ca.gc.aafc
          additivity: false
          level: INFO
          AppenderRef:
            - ref: LogToConsole
      Root:
          level: WARN
          AppenderRef:
            - ref: LogToConsole
