dwc:
  core:
    rowType: "http://rs.tdwg.org/dwc/terms/Occurrence"
    entityType: "occurrence"
    fileLocations:
      - "occurrence.csv"

    resourceContexts:
      materialSample:
        root: true

      attachment:
        context: "materialSample"
        path: "attachment"

      organism:
        context: "materialSample"
        path: "organism"
        filter: "@.determination[?(@.isPrimary == true)]"

      collectingEvent:
        context: "materialSample"
        path: "collectingEvent"

      geoReferenceAssertions:
        context: "collectingEvent"
        path: "geoReferenceAssertions"
        filter: "@.isPrimary == true"

      determination:
        context: "organism"
        path: "determination"
        filter: "@.isPrimary == true"

    columns:
    # From organism
    - dwcTerm: "occurrenceID"
      termUri: "http://rs.tdwg.org/dwc/terms/occurrenceID"
      context: "organism"
      source: "id"

    - dwcTerm: "scientificName"
      termUri: "http://rs.tdwg.org/dwc/terms/scientificName"
      context: "determination"
      source: "scientificName"

    # From materialSample
    - dwcTerm: "catalogNumber"
      termUri: "http://rs.tdwg.org/dwc/terms/catalogNumber"
      context: "materialSample"
      source: "materialSampleName"

    - dwcTerm: "collectionCode"
      termUri: "http://rs.tdwg.org/dwc/terms/collectionCode"
      context: "materialSample"
      source: "collection.code"

    # From collectingEvent
    - dwcTerm: "verbatimLocality"
      termUri: "http://rs.tdwg.org/dwc/terms/verbatimLocality"
      context: "collectingEvent"
      source: "dwcVerbatimLocality"

    - dwcTerm: "eventDate"
      termUri: "http://rs.tdwg.org/dwc/terms/eventDate"
      context: "collectingEvent"
      source: "startEventDateTime"

    - dwcTerm: "locality"
      termUri: "http://rs.tdwg.org/dwc/terms/locality"
      context: "collectingEvent"
      source: "dwcVerbatimLocality"

    - dwcTerm: "decimalLatitude"
      termUri: "http://rs.tdwg.org/dwc/terms/decimalLatitude"
      context: "geoReferenceAssertions"
      source: "dwcDecimalLatitude"

    - dwcTerm: "decimalLongitude"
      termUri: "http://rs.tdwg.org/dwc/terms/decimalLongitude"
      context: "geoReferenceAssertions"
      source: "dwcDecimalLongitude"

    - dwcTerm: "stateProvince"
      termUri: "http://rs.tdwg.org/dwc/terms/stateProvince"
      context: "collectingEvent"
      source: "dwcStateProvince"

    - dwcTerm: "county"
      termUri: "http://rs.tdwg.org/dwc/terms/county"
      context: "collectingEvent"
      source: "geographicPlaceNameSourceDetail.higherGeographicPlaces"
      filter: "@.placeType == 'county'"
      path: "name"

    - dwcTerm: "countryCode"
      termUri: "http://rs.tdwg.org/dwc/terms/countryCode"
      context: "collectingEvent"
      source: "dwcCountryCode"

    # From attachment metadata (to-many, values resolved via controlled-vocabulary-item and joined with " | ")
    - dwcTerm: "associatedSequences"
      termUri: "http://rs.tdwg.org/dwc/terms/associatedSequences"
      context: "attachment"
      source: "managedAttributes"
      vocabularyValue: "uriTemplate"
      vocabularyKey: "ena_run_accession"
      valuePlaceholder: "$1"
      vocabularyUrlTemplate: "${dina.export.objectStoreApiUrl}/controlled-vocabulary-item"
      dinaComponent: "METADATA"

    # Static value
    - dwcTerm: "basisOfRecord"
      termUri: "http://rs.tdwg.org/dwc/terms/basisOfRecord"
      staticValue: "PreservedSpecimen"